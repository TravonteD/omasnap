name: Build Linux

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  archlinux:
    name: Arch Linux x86_64
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build and runtime dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cmake ninja pkgconf qt6-base layer-shell-qt
          wayland wayland-protocols tesseract tesseract-data-eng

      - name: Check out source
        uses: actions/checkout@v4

      - name: Check installer scripts
        run: bash -n install-omarchy omarchy-capture-editor-setup

      - name: Configure release build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile
        run: cmake --build build --parallel

      - name: Run interaction smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/omarchy-capture-editor-smoke /tmp/omarchy-capture-editor-smoke

      - name: Stage installation
        run: cmake --install build --prefix "$PWD/stage/usr"
      - name: Run Omarchy setup smoke
        run: |
          fixture="$PWD/setup-fixture"
          mkdir -p "$fixture/config/hypr"
          printf '%s\n' 'require("default.hypr.omarchy")' > "$fixture/config/hypr/hyprland.lua"
          export HOME="$fixture/home"
          export XDG_CONFIG_HOME="$fixture/config"
          export XDG_DATA_HOME="$PWD/stage/usr/share"
          export OMARCHY_CAPTURE_EDITOR_SKIP_RELOAD=1
          ./stage/usr/bin/omarchy-capture-editor-setup
          ./stage/usr/bin/omarchy-capture-editor-setup
          test "$(grep -Fxc 'require("hypr.omarchy_capture_editor")' "$fixture/config/hypr/hyprland.lua")" -eq 1
          ./stage/usr/bin/omarchy-capture-editor-setup --remove
          test ! -e "$fixture/config/hypr/omarchy_capture_editor.lua"
          ! grep -Fq 'hypr.omarchy_capture_editor' "$fixture/config/hypr/hyprland.lua"

      - name: Package Linux artifact
        run: |
          version="$(QT_QPA_PLATFORM=offscreen ./build/omarchy-capture-editor --version | cut -d' ' -f2)"
          archive="omarchy-capture-editor-${version}-archlinux-x86_64.tar.gz"
          echo "CAPTURE_ARCHIVE=${archive}" >> "$GITHUB_ENV"
          echo "CAPTURE_ARTIFACT=${archive%.tar.gz}" >> "$GITHUB_ENV"
          tar -C stage -czf "$archive" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CAPTURE_ARTIFACT }}
          path: ${{ env.CAPTURE_ARCHIVE }}
          if-no-files-found: error

      - name: Attach artifact to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.CAPTURE_ARCHIVE }}
